  deploy-vm3:
    runs-on: ubuntu-latest
    needs: build-and-upload-to-docker-hub
    steps:
      - name: Deploy to third VM
        env:
          HOST: ${{ secrets.VM3_HOST }}  # Update with your VM IP
          USER: ${{ secrets.VM3_USERNAME }}
          PASSWORD: ${{ secrets.VM3_PASSWORD }}
        run: |
          sshpass -p "${PASSWORD}" ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            docker pull indrafajar/index-be:latest
            docker stop index-be || true
            docker rm index-be || true
            docker run -d --name index-be --env-file ~/.env --restart unless-stopped --network pos-app -p 3100:3000 indrafajar/index-be:latest
            docker image prune -f
          EOF
