name: Deploy to VM Broo

on:
  push:
    branches:
      - master  # Adjust this to your deployment branch

jobs:
  build-and-upload-to-docker-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: indrafajar/index-be:latest  # Update this

  deploy-vm1:
    runs-on: ubuntu-latest
    needs: build-and-upload-to-docker-hub
    steps:
      - name: Deploy to VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          HOST: ${{ secrets.VM_HOST }}  # Update with your VM IP
          USER: ${{ secrets.VM_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            docker pull indrafajar/index-be:latest
            if [ "$(docker ps -aq -f name=index-be-run)" ]; then
              if [ "$(docker ps -q -f name=index-be-run)" ]; then
                docker stop index-be-run
              fi
              docker container rm index-be-run
              docker run -d --name index-be-run --restart unless-stopped --network my-app -p 6000:3000 indrafajar/index-be:latest
            else
              docker run -d --name index-be-run --restart unless-stopped --network my-app -p 6000:3000 indrafajar/index-be:latest
            fi
            docker image prune -f
          EOF
